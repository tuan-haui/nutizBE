version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
    volumes:
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    depends_on:
      - redis

  worker:
    build: .
    command: python -m app.workers.media_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
    volumes:
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
